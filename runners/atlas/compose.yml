# atlas runner "atlas-light". Lives at /srv/docker/stacks/gitea-runner/ beside
# config.yaml, env/ (registration-token) and data/ (runner state and cache).
services:
  runner:
    image: gitea/runner:5.0.0
    container_name: atlas-light
    restart: unless-stopped
    # Host networking puts the cache server on atlas's address, which job
    # containers reach through their bridge gateway.
    network_mode: host
    environment:
      CONFIG_FILE: /config.yaml
      GITEA_INSTANCE_URL: http://atlas.pupluppy.internal:3080
      GITEA_RUNNER_NAME: atlas-light
    volumes:
      - ./config.yaml:/config.yaml:ro
      - ./data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    # Caps the runner process. Job containers carry their own caps from
    # container.options in config.yaml.
    mem_limit: 512m
    cpus: 0.5
    # Drain on stop: just above runner.shutdown_timeout.
    stop_grace_period: 6m
