# atlas runner "atlas-light": seconds-long jobs only. atlas hosts Gitea, so
# jobs run in capped containers and cannot starve it.
log:
  level: info
runner:
  file: /data/.runner
  capacity: 2
  timeout: 15m
  shutdown_timeout: 5m
  labels:
    - "light:docker://heroiclands/ci-job:1"
cache:
  enabled: true
  dir: /data/cache
container:
  docker_host: unix:///var/run/docker.sock
  privileged: false
  force_pull: false
  # Per job container; two at once stay within 2 GB and 1.5 cores.
  options: --memory=1g --memory-swap=1g --cpus=0.75 --pids-limit=512
