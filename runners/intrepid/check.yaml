# Intrepid runner "intrepid-check": light and lint jobs, two at a time, in the
# job image on OrbStack.
log:
  level: info
runner:
  file: /data/.runner
  capacity: 2
  timeout: 30m
  shutdown_timeout: 10m
  labels:
    - "light:docker://heroiclands/ci-job:1"
    - "lint:docker://heroiclands/ci-job:1"
cache:
  enabled: true
  dir: /data/cache
container:
  docker_host: unix:///var/run/docker.sock
  privileged: false
  force_pull: false
