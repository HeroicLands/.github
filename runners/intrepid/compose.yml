# Intrepid's two runners, as containers in OrbStack's Linux VM. Lives at
# ~/.local/share/heroiclands/gitea-runner/ beside check.yaml, heavy.yaml and
# data/<instance>/ (runner state and cache). OrbStack starts at login and
# restarts the containers with it.
#
# Host networking puts each runner's cache server on the VM's address, which job
# containers reach through their bridge gateway.
x-runner: &runner
  image: gitea/runner:5.0.0
  restart: unless-stopped
  network_mode: host
  # Drain on stop: just above runner.shutdown_timeout.
  stop_grace_period: 11m

services:
  check:
    <<: *runner
    container_name: intrepid-check
    environment:
      CONFIG_FILE: /config.yaml
      GITEA_INSTANCE_URL: https://git.pupluppy.org/
      GITEA_RUNNER_NAME: intrepid-check
    volumes:
      - ./check.yaml:/config.yaml:ro
      - ./data/check:/data
      - /var/run/docker.sock:/var/run/docker.sock
  heavy:
    <<: *runner
    container_name: intrepid-heavy
    environment:
      CONFIG_FILE: /config.yaml
      GITEA_INSTANCE_URL: https://git.pupluppy.org/
      GITEA_RUNNER_NAME: intrepid-heavy
    volumes:
      - ./heavy.yaml:/config.yaml:ro
      - ./data/heavy:/data
      - /var/run/docker.sock:/var/run/docker.sock
