name: Changesets

# The local action checks this repository's PRs using the proposed source.

on:
  pull_request:
    types: [opened, reopened, synchronize]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  pull-requests: read

jobs:
  changesets:
    name: Changeset review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./actions/changesets
        with:
          token: ${{ github.token }}

  action-tests:
    name: Changesets action tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node --test actions/changesets/changesets.test.mjs
