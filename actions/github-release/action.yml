name: GitHub Release from a verified tag
description: >-
  Wait until the push mirror has delivered a tag to GitHub at the commit it
  names in this checkout, then create the GitHub Release as a draft, upload and
  check every asset, and publish it with prerelease and make_latest set
  explicitly. Artifact mode instead verifies an explicit public commit and
  creates only a missing tag at it without transferring source history. A
  release meant to be Latest is proved to be served by releases/latest/download.
  Never edits a published release. The repository is read from package.json.

inputs:
  token:
    description: >-
      A GitHub token with Contents read and write on the release repository,
      such as a fine-grained personal access token. The job token of another
      forge is not one.
    required: true
  tag:
    description: >-
      The tag to release. It must exist in this checkout. Mirrored mode requires
      GitHub's copy to name its commit; artifact mode uses public-target-sha.
    required: true
  target-mode:
    description: >-
      mirrored waits for GitHub's tag to match the local commit. artifact
      requires public-target-sha and creates a missing tag at that verified
      GitHub commit. An existing conflicting tag is never overwritten.
    required: false
    default: mirrored
  public-target-sha:
    description: >-
      Required in artifact mode: the full 40-character commit SHA already
      reachable from the public default branch of the GitHub repository named
      by package.json. Branch names, short SHAs, missing and fork-only commits
      are refused. Forbidden in mirrored mode. Artifact mode requires a
      repository without a push mirror.
    required: false
    default: ""
  name:
    description: The release title. Empty means the tag.
    required: false
    default: ""
  body-path:
    description: A file holding the release notes. Empty means no notes.
    required: false
    default: ""
  prerelease:
    description: The literal true or false.
    required: true
  make-latest:
    description: >-
      The literal true or false. True for a prerelease is refused, since GitHub
      never serves a prerelease as Latest.
    required: true
  files:
    description: >-
      Newline-separated globs of the files to attach, relative to the working
      directory. Mirrored mode permits unmatched globs. Artifact mode requires
      every pattern to match a file and every ZIP to have its exact same-name
      .sha256 companion with a verified digest. Other asset types are allowed.
      No file at all is an error in either mode.
    required: true
  wait-seconds:
    description: How long to wait for tag visibility after mirror delivery or artifact tag creation.
    required: false
    default: "900"
  poll-seconds:
    description: How long to wait between checks for the tag and for Latest.
    required: false
    default: "15"
  api-url:
    description: GitHub's REST API.
    required: false
    default: https://api.github.com
  uploads-url:
    description: GitHub's upload host for release assets.
    required: false
    default: https://uploads.github.com
  server-url:
    description: The GitHub web host that serves releases/latest/download.
    required: false
    default: https://github.com

outputs:
  release-url:
    description: The published release's page.
    value: ${{ steps.release.outputs.release-url }}
  release-id:
    description: The published release's numeric id.
    value: ${{ steps.release.outputs.release-id }}

runs:
  using: composite
  steps:
    - name: Publish the GitHub Release
      id: release
      shell: bash
      env:
        RELEASE_TOKEN: ${{ inputs.token }}
        RELEASE_TAG: ${{ inputs.tag }}
        RELEASE_TARGET_MODE: ${{ inputs.target-mode }}
        RELEASE_PUBLIC_TARGET_SHA: ${{ inputs.public-target-sha }}
        RELEASE_NAME: ${{ inputs.name }}
        RELEASE_BODY_PATH: ${{ inputs.body-path }}
        RELEASE_PRERELEASE: ${{ inputs.prerelease }}
        RELEASE_MAKE_LATEST: ${{ inputs.make-latest }}
        RELEASE_FILES: ${{ inputs.files }}
        RELEASE_WAIT_SECONDS: ${{ inputs.wait-seconds }}
        RELEASE_POLL_SECONDS: ${{ inputs.poll-seconds }}
        RELEASE_API_URL: ${{ inputs.api-url }}
        RELEASE_UPLOADS_URL: ${{ inputs.uploads-url }}
        RELEASE_SERVER_URL: ${{ inputs.server-url }}
      run: node "$GITHUB_ACTION_PATH/github-release.mjs"
