name: Organisation labels
description: >-
  Check an organisation's labels against a registry file, or sync them to it. The
  registry is a closed set: a label the organisation has and the file does not
  is removed. Gitea only.

inputs:
  mode:
    description: >-
      check — validate the registry and report what syncing would change,
      touching nothing. sync — make the forge match the registry.
    required: false
    default: check
  registry:
    description: Path to the label registry, relative to the checkout root.
    required: false
    default: labels.yml
  org:
    description: >-
      The organisation whose labels are compared. Without it, the registry is
      validated and nothing is compared.
    required: false
    default: ""
  token:
    description: >-
      A token that can write the organisation's labels. Required for `sync`;
      `check` reads the labels and so wants one too, but degrades to
      validating the file alone without it.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install the action's own dependency
      shell: bash
      run: npm install --prefix "$GITHUB_ACTION_PATH" --no-audit --no-fund --silent

    - name: ${{ inputs.mode }}
      shell: bash
      env:
        LABELS_MODE: ${{ inputs.mode }}
        LABELS_REGISTRY: ${{ inputs.registry }}
        LABELS_ORG: ${{ inputs.org }}
        GITHUB_TOKEN: ${{ inputs.token }}
      run: node "$GITHUB_ACTION_PATH/labels.mjs"
