name: Changesets
description: >-
  Report the changesets a pull request adds. Fails only when the pull request
  cannot be read. Reports; never edits.

inputs:
  token:
    description: >-
      A token with `contents: read` and `pull-requests: read`, used to list the
      pull request's files. The calling workflow's own
      `github.token` is enough — pass it wrapped in expression braces there;
      an expression written in this manifest is evaluated when it loads.
    required: true

runs:
  using: composite
  steps:
    - name: Check the changesets
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
      run: node "$GITHUB_ACTION_PATH/changesets.mjs"
