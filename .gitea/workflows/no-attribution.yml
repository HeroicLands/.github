name: No Attribution

# The local action checks this repository's PRs using the proposed source.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  no-attribution:
    name: No AI attribution
    runs-on: light
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./actions/no-attribution
        with:
          token: ${{ github.token }}

  action-tests:
    name: Attribution action tests
    runs-on: light
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
      - run: node --test actions/no-attribution/no-attribution.test.mjs
