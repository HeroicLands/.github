name: No Attribution

# The local action checks this repository's PRs using the proposed source.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  no-attribution:
    name: No AI attribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./actions/no-attribution
        with:
          token: ${{ github.token }}

  action-tests:
    name: Attribution action tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node --test actions/no-attribution/no-attribution.test.mjs
