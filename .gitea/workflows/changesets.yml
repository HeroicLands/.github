name: Changesets

# The local action checks this repository's PRs using the proposed source.

on:
  pull_request:
    types: [opened, reopened, synchronize]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  pull-requests: read

jobs:
  changesets:
    name: Changeset review
    runs-on: light
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./actions/changesets
        with:
          token: ${{ github.token }}

  action-tests:
    name: Changesets action tests
    runs-on: light
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
      - run: node --test actions/changesets/changesets.test.mjs
